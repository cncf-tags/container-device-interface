on: [push, pull_request]
name: Sanity

permissions:
  contents: read

env:
  GO_VERSION: '1.24.x'

jobs:
  build:
    name: "Run go sanity tools"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Install golint
      run: go install golang.org/x/lint/golint@latest
    - name: Lint
      run: make lint
    - name: Fmt
      run: |
        make fmt && git diff --exit-code
    - name: Vet
      run: make vet
    - name: Verify go modules are properly up-to-date
      run: |
        make mod-tidy && git diff --exit-code

  test:
    name: "Run tests / Go ${{ matrix.go-version || 'minimum' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "" # leave empty to use go-version-file (use go.mod)
          - oldstable
          - stable
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        go-version-file: go.mod # used when go-version is empty
    - name: Test
      run: make test


  # Make sure binaries compile on multiple platforms.
  crossbuild:
    name: "Build / Crossbuild Binaries"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
        run: |
          env | grep ^GO
          make
